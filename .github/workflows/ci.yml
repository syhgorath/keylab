name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Ana ürün: Go. Eski kabuk motoruyla karşılaştırma testleri kayıtlı altın dosyalardan (testdata/) oynatılır; kabuk/python gerekmez (ssh-keygen gerekir).
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false # bağımlılık yok (go.sum yok): önbellek anlamsız, uyarı veriyordu
      - name: vet
        working-directory: go
        run: go vet ./...
      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)"
      # Gerçek paket (components/) gerektiren karşılaştırmalı testler CI'da atlanır: components/ repoya girmez, tarihsel sürümler yalnız USB'de.
      # macOS'un bash 3.2'si UTF-8 yerelinde Türkçe karakterleri farklı sayar; kabukla parite C yerelinde tutar (eski kabuk CI'ındaki LC_ALL=C ile aynı neden).
      - name: "Testler (-short: uzun karşılaştırmalı testler hariç)"
        working-directory: go
        env:
          LC_ALL: ${{ matrix.os == 'macos-latest' && 'C' || '' }} # Linux: runner varsayılanı (ayar yok); yalnız macOS'ta C
        run: go test ./... -short -count=1
      - name: Derleme (tek ikili)
        working-directory: go
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sshpocket . && /tmp/sshpocket version
  # Arayüz testleri: gerçek arayüz jsdom'da, kaydedilmiş API yanıtlarıyla (bkz. go/webtest/README.md). Yalnız geliştirme aracı; ikiliye girmez.
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bağımlılıklar (kilit dosyasıyla, kurulum betiği çalıştırmadan)
        working-directory: go/webtest
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Arayüz testleri
        working-directory: go/webtest
        run: npm test
  # Çok platformlu derleme denetimi: yalnız derlenir. Çalışma zamanı (Keychain, terminal, ssh-agent) şimdilik macOS'a özgüdür.
  cross:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, darwin/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: "Derleme (${{ matrix.target }})"
        working-directory: go
        env:
          CGO_ENABLED: "0"
          MATRIX_TARGET: ${{ matrix.target }}
        run: GOOS="${MATRIX_TARGET%/*}" GOARCH="${MATRIX_TARGET#*/}" go build -trimpath ./...
  # Ürünün kendi kabuk betikleri (başlatıcı ve yayın derlemesi).
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck kur (sabit sürüm, sha256 doğrulamalı)
        run: bash .github/scripts/ci-install-shellcheck.sh
      - name: ShellCheck
        run: shellcheck -s bash go/launcher/start.command go/scripts/build-release.sh go/scripts/package-app.sh go/scripts/release-publish.sh go/scripts/keylabtest.sh
      - name: Syntax check (bash -n)
        run: for f in go/launcher/start.command go/scripts/build-release.sh go/scripts/package-app.sh go/scripts/release-publish.sh go/scripts/keylabtest.sh; do bash -n "$f"; done
