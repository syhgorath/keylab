name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Ana ürün: Go. Kabuk motorunun (referans/kabuk) karşılaştırmalı testleri de burada koşar (bash, python3 ve ssh-keygen gerekir).
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false # bağımlılık yok (go.sum yok): önbellek anlamsız, uyarı veriyordu
      - name: vet
        working-directory: go
        run: go vet ./...
      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)"
      # Gerçek paket (components/) gerektiren karşılaştırmalı testler CI'da atlanır: components/ repoya girmez, tarihsel sürümler yalnız USB'de.
      # macOS'un bash 3.2'si UTF-8 yerelinde Türkçe karakterleri farklı sayar; kabukla parite C yerelinde tutar (eski kabuk CI'ındaki LC_ALL=C ile aynı neden).
      - name: "Testler (-short: uzun karşılaştırmalı testler hariç)"
        working-directory: go
        env:
          LC_ALL: ${{ matrix.os == 'macos-latest' && 'C' || '' }} # Linux: runner varsayılanı (ayar yok); yalnız macOS'ta C
        run: go test ./... -short -count=1
      - name: Derleme (tek ikili)
        working-directory: go
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sshpocket . && /tmp/sshpocket version
  # Çok platformlu derleme denetimi: yalnız derlenir. Çalışma zamanı (Keychain, terminal, ssh-agent) şimdilik macOS'a özgüdür.
  cross:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, darwin/amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: "Derleme (${{ matrix.target }})"
        working-directory: go
        env:
          CGO_ENABLED: "0"
          MATRIX_TARGET: ${{ matrix.target }}
        run: GOOS="${MATRIX_TARGET%/*}" GOARCH="${MATRIX_TARGET#*/}" go build -trimpath ./...
  # Referans kabuk motoru (dondurulmuş): Go portunun şartnamesi. Değişmemesi beklenir; yine de bozulmasın diye koşar.
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck kur (sabit sürüm, sha256 doğrulamalı)
        run: bash referans/kabuk/scripts/ci-install-shellcheck.sh
      - name: ShellCheck
        working-directory: referans/kabuk
        run: shellcheck -x -s bash start.sh start.command sistem/*.sh sistem/Helpers/*.sh
      - name: Syntax check (bash -n)
        working-directory: referans/kabuk
        run: for f in start.sh start.command sistem/*.sh sistem/Helpers/*.sh; do bash -n "$f"; done
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        # Runner ağı (apt DNS) ara sıra çözümlenemiyor: 4 denemeye kadar tekrarlanır.
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y bats && exit 0
            echo "apt denemesi $i başarısız; 20 sn sonra tekrar"; sleep 20
          done
          exit 1
      - name: Run tests
        working-directory: referans/kabuk
        run: bats test
  # macOS (Apple Silicon, yeni macOS) + macOS'un kendi bash 3.2'si: referans motorun gerçek ortamı.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ortam bilgisi
        run: |
          uname -m
          sw_vers
          PATH="/bin:$PATH" bash --version | head -1
          ssh -V
      - name: Araçları kur
        run: brew install bats-core
      - name: ShellCheck kur (sabit sürüm, sha256 doğrulamalı)
        run: bash referans/kabuk/scripts/ci-install-shellcheck.sh
      - name: ShellCheck
        working-directory: referans/kabuk
        run: shellcheck -x -s bash start.sh start.command sistem/*.sh sistem/Helpers/*.sh
      - name: Testler (macOS bash 3.2 ile)
        working-directory: referans/kabuk
        # LC_ALL=C: macOS bash 3.2 + UTF-8 yerelinde bats, Türkçe karakterli test adlarını yanlış kodlar
        env:
          LC_ALL: C
          LANG: C
        run: PATH="/bin:/usr/bin:$PATH" bats test
